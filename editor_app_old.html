<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUNIQUE — Content Editor</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --pink:#E91E8C;--pink-dark:#C2185B;--pink-soft:#FDE4EF;
  --teal:#00BCD4;--teal-dark:#0097A7;--teal-soft:#E0F7FA;
  --dark:#1A1A1A;--mid:#4A4A4A;--light:#888;
  --border:#E0E0E0;--bg:#F7F9FC;--white:#fff;
  --sidebar-w:240px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Urbanist',sans-serif}
body{background:var(--bg);color:var(--dark);display:flex;flex-direction:column}
.topbar{height:50px;background:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.topbar-brand{display:flex;align-items:center;gap:.6rem}
.topbar-brand img{height:28px;filter:brightness(0)invert(1)opacity(.85);border-radius:4px}
.topbar-title{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.topbar-right{display:flex;gap:.6rem;align-items:center}
.save-status{font-size:.72rem;color:rgba(255,255,255,.45);transition:color .3s}
.save-status.dirty{color:#FF9800}
.save-status.saved{color:#4CAF50}
.btn-top{padding:.38rem .9rem;border-radius:50px;font-family:'Urbanist',sans-serif;font-size:.75rem;font-weight:700;cursor:pointer;border:none;letter-spacing:.05em;transition:all .2s}
.btn-save{background:var(--pink);color:#fff}
.btn-save:hover{background:var(--pink-dark)}
.btn-dl{background:rgba(0,188,212,.2);color:var(--teal);border:1px solid rgba(0,188,212,.4)}
.btn-dl:hover{background:rgba(0,188,212,.35)}

.workspace{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-hd{padding:.75rem 1rem .6rem;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-hd h3{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--light)}
.page-list{flex:1;overflow-y:auto;padding:.35rem 0}
.page-item{display:flex;align-items:center;gap:.55rem;padding:.6rem 1rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent;font-size:.85rem;font-weight:500;color:var(--mid)}
.page-item:hover{background:var(--bg);color:var(--dark)}
.page-item.active{background:var(--pink-soft);color:var(--pink);border-left-color:var(--pink);font-weight:600}
.page-item .pi{font-size:.95rem;width:18px;text-align:center;flex-shrink:0}

/* Editor main */
.editor-main{flex:1;overflow-y:auto;padding:1.5rem 1.75rem}
.editor-main::-webkit-scrollbar{width:5px}
.editor-main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.pg-hd{margin-bottom:1.5rem}
.pg-hd h2{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;color:var(--dark)}
.pg-hd .pg-url{display:inline-flex;align-items:center;gap:.35rem;font-size:.73rem;color:var(--teal-dark);background:var(--teal-soft);padding:.18rem .55rem;border-radius:4px;margin-top:.3rem;font-weight:600}

.fsec{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;overflow:hidden}
.fsec-hd{padding:.75rem 1.1rem;background:linear-gradient(90deg,var(--bg),#fff);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem}
.fsec-hd h4{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mid)}
.fsec-body{padding:1.1rem}
.fg{margin-bottom:1rem}
.fg:last-child{margin-bottom:0}
.fl{display:flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--light);margin-bottom:.35rem}
.ft{font-size:.63rem;background:var(--pink-soft);color:var(--pink);padding:.1rem .38rem;border-radius:4px}
.ft.img{background:var(--teal-soft);color:var(--teal-dark)}
.fi{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:.55rem .75rem;font-family:'Urbanist',sans-serif;font-size:.88rem;color:var(--dark);background:#fff;transition:border-color .2s,box-shadow .2s;resize:vertical}
.fi:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,188,212,.1)}
textarea.fi{min-height:72px;line-height:1.55}

/* Image field */
.img-field{display:flex;align-items:center;gap:.85rem;padding:.65rem;background:var(--bg);border-radius:8px;border:1.5px dashed var(--border);cursor:pointer;transition:border-color .2s}
.img-field:hover{border-color:var(--teal)}
.img-thumb{width:60px;height:60px;border-radius:7px;object-fit:cover;flex-shrink:0;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1);background:var(--border)}
.img-info{flex:1;min-width:0}
.img-name{font-size:.78rem;font-weight:600;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.img-hint{font-size:.68rem;color:var(--light);margin-top:.15rem}
.img-btn{background:#fff;border:1.5px solid var(--border);padding:.35rem .75rem;border-radius:6px;font-family:'Urbanist',sans-serif;font-size:.73rem;font-weight:600;cursor:pointer;color:var(--mid);transition:all .2s;flex-shrink:0}
.img-btn:hover{border-color:var(--teal);color:var(--teal-dark)}
input[type=file]{display:none}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:.85rem;text-align:center;padding:2rem}
.empty .ei{font-size:2.5rem}
.empty h3{font-size:1rem;font-weight:600;color:var(--dark)}
.empty p{font-size:.8rem;color:var(--light);line-height:1.6;max-width:260px}

.toast{position:fixed;bottom:1.25rem;right:1.25rem;background:var(--dark);color:#fff;padding:.6rem 1.1rem;border-radius:50px;font-size:.78rem;font-weight:600;opacity:0;transform:translateY(6px);transition:all .3s;pointer-events:none;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div class="lock-screen" id="editorLock"><div class="lock-card"><img src="images/Logo-lang-lang.svg" alt="NUNIQUE"><h1>Content Editor</h1><p>Geschützt vor Suchmaschinen und mit Passwortabfrage. Standard-Passwort bitte nach dem Upload ändern.</p><input type="password" id="editorPassword" placeholder="Passwort"><button type="button" id="editorUnlock">Editor öffnen</button><div class="lock-error" id="editorLockError">Falsches Passwort.</div></div></div>

<div class="topbar">
  <div class="topbar-brand">
    <img src="images/Logo-lang-lang.svg" alt="NUNIQUE" onerror="this.style.display='none'">
    <span class="topbar-title">Content Editor</span>
  </div>
  <div class="topbar-right">
    <span class="save-status" id="saveStatus">Bereit</span>
    <button class="btn-top btn-dl" onclick="downloadCurrent()">⬇ Datei laden</button>
    <button class="btn-top btn-save" onclick="applyAndDownload()">💾 Speichern &amp; Herunterladen</button>
  </div>
</div>

<div class="workspace">
  <div class="sidebar">
    <div class="sidebar-hd"><h3>Seiten</h3></div>
    <div class="page-list" id="pageList"></div>
  </div>
  <div class="editor-main" id="editorMain">
    <div class="empty"><div class="ei">✏️</div><h3>Seite auswählen</h3><p>Klicken Sie links auf eine Seite um Texte und Bilder zu bearbeiten.</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

  {title:'✏️ Stellenausschreibung',fields:[
    {id:'jb_intro',label:'Einleitung',sel:'.section-head.fade-up p',type:'textarea'},
    {id:'job1_h3',label:'Position 1 — Titel',sel:'.job-card:nth-child(1) h3',type:'text'},
    {id:'job1_p', label:'Position 1 — Text', sel:'.job-card:nth-child(1) > p:first-of-type',type:'textarea'},
    {id:'job2_h3',label:'Position 2 — Titel',sel:'.job-card:nth-child(2) h3',type:'text'},
    {id:'job2_p', label:'Position 2 — Text', sel:'.job-card:nth-child(2) > p:first-of-type',type:'textarea'},
  ]},
]},
{id:'order',file:'order.html',icon:'📋',label:'Torte anfragen',sections:[
  {title:'🏷 Seitenbanner',fields:[
    {id:'or_h1', label:'Titel',    sel:'.order-hero h1',type:'text'},
    {id:'or_sub',label:'Untertitel',sel:'.order-hero p',type:'text'},
  ]},
]},
{id:'impressum',file:'impressum.html',icon:'⚖️',label:'Impressum',sections:[
  {title:'📋 Impressum-Daten',fields:[
    {id:'imp_name',label:'Name / Inhaberin',sel:'.container-sm h3',type:'text'},
  ]},
]},
];

// ── STATE ─────────────────────────────────────────────────────────────────────
let curPage=null, changes={}, docs={};

// ── INIT ──────────────────────────────────────────────────────────────────────
PAGES.forEach(p=>{
  const el=document.createElement('div');
  el.className='page-item';el.dataset.id=p.id;
  el.innerHTML=`<span class="pi">${p.icon}</span><span>${p.label}</span>`;
  el.addEventListener('click',()=>selectPage(p.id));
  document.getElementById('pageList').appendChild(el);
});

async function selectPage(id){
  document.querySelectorAll('.page-item').forEach(e=>e.classList.remove('active'));
  document.querySelector('[data-id="'+id+'"]').classList.add('active');
  curPage=PAGES.find(p=>p.id===id);
  await loadPage(curPage);
  renderEditor(curPage);
}

async function loadPage(page){
  if(docs[page.id]) return;
  try{
    const r=await fetch(page.file+'?v='+Date.now());
    const t=await r.text();
    const p=new DOMParser();
    docs[page.id]={raw:t,doc:p.parseFromString(t,'text/html')};
  }catch(e){ docs[page.id]={raw:'',doc:document.implementation.createHTMLDocument()}; }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderEditor(page){
  const main=document.getElementById('editorMain');
  const d=docs[page.id]?.doc;
  let h=`<div class="pg-hd"><h2>${page.icon} ${page.label}</h2><div class="pg-url">📄 ${page.file}</div></div>`;

  page.sections.forEach(sec=>{
    h+=`<div class="fsec"><div class="fsec-hd"><h4>${sec.title}</h4></div><div class="fsec-body">`;
    sec.fields.forEach(f=>{
      const el=d?d.querySelector(f.sel):null;
      let val=changes[page.id]?.[f.id];
      if(val===undefined){
        if(f.type==='image'){val=el?el.getAttribute('src'):'';
        }else if(f.type==='bgimage'){
          const style=el?el.getAttribute('style'):'';
          const m=style&&style.match(/url\(['"]?([^'")\s]+)/);
          val=m?m[1]:'';
        }else{ val=el?(el.textContent||'').trim():'';}
      }
      if(f.type==='image'||f.type==='bgimage'){
        h+=`<div class="fg">
          <div class="fl"><span>${f.label}</span><span class="ft img">BILD</span></div>
          <div class="img-field" onclick="document.getElementById('file_${f.id}').click()">
            <img class="img-thumb" id="thumb_${f.id}" src="${esc(val)}" alt=""
              onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect fill=%22%23eee%22 width=%2260%22 height=%2260%22/></svg>'">
            <div class="img-info">
              <div class="img-name" id="iname_${f.id}">${fname(val)}</div>
              <div class="img-hint">Klicken zum Auswählen · JPG PNG WebP</div>
            </div>
            <button class="img-btn" type="button">Ändern</button>
          </div>
          <input type="file" id="file_${f.id}" accept="image/*"
            onchange="handleImg('${page.id}','${f.id}','${esc(f.sel)}','${f.type}',this)">
        </div>`;
      } else {
        const tag=f.type==='textarea'?'textarea':'input';
        const attrs=f.type==='textarea'?'rows="3"':'type="text"';
        h+=`<div class="fg">
          <div class="fl"><span>${f.label}</span></div>
          <${tag} class="fi" id="fi_${f.id}" ${attrs}
            data-pg="${page.id}" data-fid="${f.id}"
            oninput="handleTxt(this)"
          >${f.type==='textarea'?esc(val):''}</${tag}>
        </div>`;
      }
    });
    h+=`</div></div>`;
  });
  main.innerHTML=h;

  // Set input values
  page.sections.forEach(sec=>sec.fields.forEach(f=>{
    if(f.type!=='image'&&f.type!=='bgimage'){
      const el=d?d.querySelector(f.sel):null;
      let val=changes[page.id]?.[f.id];
      if(val===undefined) val=el?(el.textContent||'').trim():'';
      const inp=document.getElementById('fi_'+f.id);
      if(inp&&inp.tagName==='INPUT') inp.value=val;
    }
  }));
}

function handleTxt(el){
  const pid=el.dataset.pg,fid=el.dataset.fid;
  if(!changes[pid]) changes[pid]={};
  changes[pid][fid]=el.value||el.textContent;
  setDirty();
}

function handleImg(pid,fid,sel,ftype,input){
  const file=input.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    const durl=e.target.result;
    const th=document.getElementById('thumb_'+fid);
    const nm=document.getElementById('iname_'+fid);
    if(th) th.src=durl;
    if(nm) nm.textContent=file.name;
    if(!changes[pid]) changes[pid]={};
    changes[pid][fid]={isImg:true,file,durl,sel,ftype,name:file.name};
    setDirty();
    toast('📷 '+file.name+' ausgewählt');
  };
  r.readAsDataURL(file);
}

// ── SAVE & DOWNLOAD ───────────────────────────────────────────────────────────
function applyAndDownload(){
  if(!curPage){toast('⚠️ Keine Seite ausgewählt');return;}
  const pid=curPage.id;
  const ch=changes[pid];
  if(!ch||!Object.keys(ch).length){toast('ℹ️ Keine Änderungen');return;}
  const data=docs[pid]; if(!data?.raw)return;

  const parser=new DOMParser();
  const d=parser.parseFromString(data.raw,'text/html');

  // Apply all changes
  curPage.sections.forEach(sec=>sec.fields.forEach(f=>{
    const chg=ch[f.id]; if(chg===undefined)return;
    const el=d.querySelector(f.sel); if(!el)return;
    if(typeof chg==='object'&&chg.isImg){
      if(chg.ftype==='bgimage'){
        const old=el.getAttribute('style')||'';
        el.setAttribute('style',old.replace(/background-image:[^;]+;?/,'')+'background-image:url(\'images/'+chg.name+'\');');
      } else {
        el.setAttribute('src','images/'+chg.name);
        el.setAttribute('alt',chg.name.replace(/\.[^.]+$/,''));
      }
    } else {
      // Preserve inner elements like <strong> or <span class="faq-icon">
      const hasChildren=Array.from(el.childNodes).some(n=>n.nodeType===1);
      if(hasChildren&&f.type!=='textarea'){
        // Only update text nodes
        Array.from(el.childNodes).forEach(n=>{if(n.nodeType===3&&n.textContent.trim()) n.textContent=chg;});
      } else {
        el.textContent=chg;
      }
    }
  }));

  const newHTML='<!DOCTYPE html>\n'+d.documentElement.outerHTML;
  docs[pid]={raw:newHTML,doc:d};
  dlBlob(newHTML,curPage.file);
  setSaved();
  toast('✅ '+curPage.label+' heruntergeladen — auf Server hochladen!');
}

function downloadCurrent(){
  if(!curPage){toast('⚠️ Keine Seite');return;}
  const d=docs[curPage.id]; if(!d?.raw){toast('⚠️ Noch nicht geladen');return;}
  dlBlob(d.raw,curPage.file);
  toast('⬇ '+curPage.file);
}

function dlBlob(content,filename){
  const b=new Blob([content],{type:'text/html;charset=utf-8'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(u);
}

// ── UI HELPERS ────────────────────────────────────────────────────────────────
function setDirty(){const s=document.getElementById('saveStatus');s.textContent='● Ungespeichert';s.className='save-status dirty';}
function setSaved(){const s=document.getElementById('saveStatus');s.textContent='✓ Gespeichert';s.className='save-status saved';setTimeout(()=>{s.textContent='Bereit';s.className='save-status';},3000);}
let tTimer;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),2800);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fname(s){if(!s)return'Kein Bild';return s.split('/').pop().split('?')[0]||s;}
</script>
